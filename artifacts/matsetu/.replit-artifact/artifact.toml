kind = "web"
previewPath = "/"
title = "MatSetu Voting"
description = "A transparent institutional voting workspace that guides election setup, biometric voter verification, and blockchain-backed ballot readiness for academic and organizational elections."
version = "1.0.0"
id = "artifacts/matsetu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21946

[services.development]
run = "pnpm --filter @workspace/matsetu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matsetu", "run", "build" ]
serve = "static"
publicDir = "artifacts/matsetu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21946"
BASE_PATH = "/"
